<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка видео — Hi-Say</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>
    <div class="bg-gradient"></div>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">Hi-Say</a>
        </div>
        <div class="nav-right">
            <button class="auth-btn" id="auth-btn">Войти</button>
            <img src="" alt="" class="user-avatar" id="user-avatar" style="display: none;">
        </div>
    </nav>

    <main class="upload-page">
        <div class="upload-container">
            <h1>Загрузить историю</h1>

            <form id="upload-form" onsubmit="handleVideoUpload(event)">
                <div class="upload-area">
                    <input type="file" id="video-file" accept="video/mp4,video/webm" 
                           onchange="previewVideo(this)" style="display: none;">
                    <div class="upload-dropzone" onclick="document.getElementById('video-file').click()">
                        <div class="upload-icon">📹</div>
                        <p>Перетащи видео сюда или нажми для выбора</p>
                        <span class="upload-hint">MP4, WebM. До 100 МБ</span>
                    </div>
                </div>

                <video id="video-preview" class="video-preview" controls style="display: none;"></video>

                <div class="upload-progress-container" id="upload-progress-container" style="display: none;">
                    <progress id="upload-progress" value="0" max="100"></progress>
                    <span id="progress-text">0%</span>
                </div>

                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="video-title" placeholder="Название истории" required>
                </div>

                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="video-description" placeholder="О чём эта история..." rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label>Теги (через запятую)</label>
                    <input type="text" id="video-tags" placeholder="хоррор, юмор, приключения">
                </div>

                <button type="submit" class="submit-btn">Опубликовать</button>
            </form>
        </div>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
